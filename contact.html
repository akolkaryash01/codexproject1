<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | CitrusCraft</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a class="logo" href="index.html">CitrusCraft</a>
        <button class="nav-toggle" aria-label="Toggle menu">☰</button>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="sustainability.html">Sustainability</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <button id="themeToggle" class="btn btn-ghost" type="button">Dark Mode</button>
          <span class="cart-pill">Cart <span id="cartCount">0</span></span>
        </div>
      </nav>
    </header>

    <main class="container section">
      <h1>Contact CitrusCraft</h1>
      <p class="lead">For wholesale, collaborations, and custom requests.</p>
      <form class="contact-form">
        <label>Name<input type="text" placeholder="Your name" required /></label>
        <label>Email<input type="email" placeholder="your@email.com" required /></label>
        <label>Message<textarea rows="5" placeholder="Tell us how we can help"></textarea></label>
        <button class="btn" type="submit">Send Message</button>
      </form>
    </main>

    <footer class="site-footer">
      <div class="container footer-grid">
        <p><strong>CitrusCraft</strong> · Luxury Leather from Nature's Waste</p>
        <p>© 2026 CitrusCraft. Crafted responsibly.</p>
      </div>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
